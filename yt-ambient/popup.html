<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>YouTube Ambient Light</title>
  <style>
    body { width: 260px; margin: 0; padding: 14px; font: 13px system-ui, sans-serif; background: #151515; color: #eee; }
    h1 { font-size: 14px; margin: 0 0 12px; }
    label { display: block; margin: 10px 0 4px; }
    .row { display: flex; justify-content: space-between; align-items: center; }
    input[type=range] { width: 100%; }
    small { color: #999; display: block; margin-top: 12px; }
    button { margin-top: 12px; width: 100%; padding: 6px; border: 1px solid #444; border-radius: 6px;
             background: #242424; color: #eee; cursor: pointer; }
    button:hover { background: #2f2f2f; }
  </style>
</head>
<body>
  <h1>YouTube Ambient Light</h1>
  <div class="row">
    <label for="enabled" style="margin:0">Enabled</label>
    <input type="checkbox" id="enabled" />
  </div>
  <label for="intensity">Intensity <span id="v-intensity"></span></label>
  <input type="range" id="intensity" min="0.1" max="1" step="0.05" />
  <label for="blur">Blur <span id="v-blur"></span></label>
  <input type="range" id="blur" min="30" max="200" step="5" />
  <label for="saturate">Color boost <span id="v-saturate"></span></label>
  <input type="range" id="saturate" min="1" max="3" step="0.1" />
  <button id="reset">Reset to defaults</button>
  <small>Works with YouTube's dark theme.</small>
  <script src="popup.js"></script>
</body>
</html>
